# AI-Nexus production — SPA on 443, API exposed on 5000 (Node listens 127.0.0.1:5000 or 0.0.0.0:5000)

upstream ainexus_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

# --- SPA (port 443) ---
server {
    listen 443 ssl http2;
    server_name ainexus.isca.org.sg;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    root /var/www/ainexus-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API on public port 5000 (HTTPS) — required when frontend uses :5000/api ---
server {
    listen 5000 ssl http2;
    server_name ainexus.isca.org.sg;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /api/ {
        proxy_pass http://ainexus_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /uploads/ {
        proxy_pass http://ainexus_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://ainexus_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}

