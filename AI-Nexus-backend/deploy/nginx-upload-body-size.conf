# Fix 413 on https://ainexus.isca.org.sg:5000 — add inside the server block for port 5000:
#
#   client_max_body_size 10M;
#   proxy_read_timeout 3600s;
#   proxy_send_timeout 3600s;
#
# Admin UI uploads video in 1 MB chunks to .../upload-video/chunk (many small POSTs).
# If DevTools still shows one POST to .../upload-video with the full file, the SPA was not redeployed.

client_max_body_size 10M;
