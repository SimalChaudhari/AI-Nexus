# Fix 413 on https://ainexus.isca.org.sg:5000 — add inside the server block for port 5000:
#
#   client_max_body_size 20M;
#   proxy_read_timeout 3600s;
#   proxy_send_timeout 3600s;
#
# Videos upload in 2 MB chunks; each chunk request must pass the proxy (10–20M is enough).

client_max_body_size 20M;
