# AI-Nexus — allow large course section video uploads (default backend limit: 20 GB).
# For API on https://ainexus.isca.org.sg:5000 see nginx-server-port-5000.conf (full server block).
# Or include the directives below inside your existing server { listen 5000 ssl; } block.
#
# Example:
#   server {
#     listen 443 ssl;
#     server_name ainexus.isca.org.sg;
#     client_max_body_size 20G;
#     proxy_read_timeout 3600s;
#     proxy_send_timeout 3600s;
#     location /api/ {
#       proxy_pass https://127.0.0.1:5000;
#       ...
#     }
#   }
#
# After editing: sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 20G;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 60s;
proxy_request_buffering off;
