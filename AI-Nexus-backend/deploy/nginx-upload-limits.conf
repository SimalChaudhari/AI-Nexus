# AI-Nexus — allow large course section video uploads (default backend limit: 20 GB).
# Include inside the server { } block that proxies to the Nest API (port 5000).
#
# Example:
#   server {
#     listen 443 ssl;
#     server_name ainexus.isca.org.sg;
#     client_max_body_size 20G;
#     proxy_read_timeout 3600s;
#     proxy_send_timeout 3600s;
#     location /api/ {
#       proxy_pass https://127.0.0.1:5000;
#       ...
#     }
#   }
#
# After editing: sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 20G;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_connect_timeout 60s;
proxy_request_buffering off;
