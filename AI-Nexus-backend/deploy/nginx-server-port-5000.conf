# AI-Nexus API — HTTPS on port 5000 (ainexus.isca.org.sg:5000)
# 413 "Request Entity Too Large" on upload-video almost always means THIS file
# (or IIS equivalent) is missing client_max_body_size — not the Nest app.
#
# Install: copy into /etc/nginx/sites-available/ainexus-api.conf and symlink sites-enabled,
# or include these directives inside your existing server { listen 5000 ssl; } block.

server {
    listen 5000 ssl http2;
    server_name ainexus.isca.org.sg;

    # Required for course section videos (up to 20 GB)
    client_max_body_size 20G;
    client_body_timeout 3600s;
    client_body_buffer_size 256k;

    # SSL certificate paths — adjust to your server
    # ssl_certificate     /path/to/ainexus.isca.org.sg-chain.pem;
    # ssl_certificate_key /path/to/ainexus.isca.org.sg-key.pem;

    location / {
        proxy_pass https://127.0.0.1:5001;
        # If Node listens directly on 5000 with no inner port, use:
        # proxy_pass https://127.0.0.1:5000;
        # and change the outer listen to another port, OR run Node on 5001 only.

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
    }
}

# If Node binds :5000 directly (no outer nginx), you do NOT need this file —
# only ensure nothing in front of Node limits body size.
# Quick check after deploy:
#   curl -s https://ainexus.isca.org.sg:5000/api/health/upload-limits
