# Flowise UAT — split UI (3001) and API (3002)
#
# DNS (A/CNAME):
#   flowise.ainexusuat.isca.org.sg      → this server
#   api.flowise.ainexusuat.isca.org.sg  → this server
#
# TLS: certificate must cover BOTH hostnames (SAN or wildcard *.flowise.ainexusuat...).
# Update ssl_certificate paths to match your real cert files.
#
# App process:
#   pnpm prod:separate
#   → UI preview :3001   (flowise.ainexusuat)
#   → API server :3002   (api.flowise.ainexusuat)
#
# When nginx terminates TLS, set Flowise server SSL_ENABLED=false and use http:// backends below.
# If Node still serves HTTPS on 3001/3002, change proxy_pass to https://127.0.0.1:PORT and add:
#   proxy_ssl_verify off;

# ---------------------------------------------------------------------------
# Flowise UI — https://flowise.ainexusuat.isca.org.sg  →  127.0.0.1:3001
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name flowise.ainexusuat.isca.org.sg;

    ssl_certificate     /etc/nginx/ssl/ainexusuat.isca.org.sg-chain.pem;
    ssl_certificate_key /etc/nginx/ssl/ainexusuat.isca.org.sg-key.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------------------------
# Flowise API — https://api.flowise.ainexusuat.isca.org.sg  →  127.0.0.1:3002
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.flowise.ainexusuat.isca.org.sg;

    ssl_certificate     /etc/nginx/ssl/ainexusuat.isca.org.sg-chain.pem;
    ssl_certificate_key /etc/nginx/ssl/ainexusuat.isca.org.sg-key.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Optional HTTP → HTTPS
server {
    listen 80;
    server_name flowise.ainexusuat.isca.org.sg api.flowise.ainexusuat.isca.org.sg;
    return 301 https://$host$request_uri;
}
