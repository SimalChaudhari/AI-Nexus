# =============================================================================
# AI Nexus – production Nginx (HTTPS on 443, no :3000 in the public URL)
# =============================================================================
#
# --- On the Linux server (order matters) -----------------------------------
#
# 1) Put this file where Nginx reads site configs, e.g.:
#      sudo cp /path/to/AI-Nexus/deploy/ainexus-production.nginx.conf \
#             /etc/nginx/sites-available/ainexus.conf
#    Or symlink from your git clone:
#      sudo ln -sf /path/to/AI-Nexus/deploy/ainexus-production.nginx.conf \
#                  /etc/nginx/sites-available/ainexus.conf
#
# 2) Edit ssl_certificate and ssl_certificate_key to your real PEM paths.
#
# 3) Ensure root points at your built SPA (after `npm run build` in AI-Nexus-frontend):
#      root /var/www/ainexus/dist;
#
# 4) Match upstream port to Nest (default 5000): server 127.0.0.1:5000;
#
# 5) Enable site and reload:
#      sudo ln -sf /etc/nginx/sites-available/ainexus.conf \
#                  /etc/nginx/sites-enabled/ainexus.conf
#      sudo nginx -t && sudo systemctl reload nginx
#
# 6) Backend .env: FRONTEND_URL=https://ainexus.isca.org.sg
#    Frontend build .env: VITE_SERVER_URL=https://ainexus.isca.org.sg/api
#
# Local dev: http://localhost:3000 unchanged.
# =============================================================================

upstream ainexus_api {
    zone ainexus_api 64k;
    server 127.0.0.1:5000;
    keepalive 8;
}

# Optional: redirect HTTP → HTTPS (uncomment if you serve plain 80)
# server {
#     listen 80;
#     server_name ainexus.isca.org.sg;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl;
    http2 on;
    server_name ainexus.isca.org.sg;

    ssl_certificate     /etc/ssl/ainexus/ainexus.isca.org.sg-chain.pem;
    ssl_certificate_key /etc/ssl/ainexus/ainexus.isca.org.sg-key.pem;

    location /api/ {
        proxy_pass http://ainexus_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    location /socket.io/ {
        proxy_pass http://ainexus_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    root /var/www/ainexus/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Flowise on same host — see frontend .env.example
    # location /flowise/ {
    #     proxy_pass http://127.0.0.1:3001/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

